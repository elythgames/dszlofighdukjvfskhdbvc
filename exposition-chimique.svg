<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Guide de sécurité en cas d'exposition chimique suspectée</title>
<desc id="d">Quatre réflexes: s'éloigner, retirer les vêtements contaminés, rincer les yeux sans frotter et laver la peau.</desc>
<rect width="1600" height="900" fill="#11151c"/>
<rect x="40" y="40" width="1520" height="820" rx="32" fill="#171d26" stroke="#394657" stroke-width="3"/>
<text x="800" y="120" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="50" font-weight="900">EXPOSITION CHIMIQUE SUSPECTÉE</text>
<text x="800" y="165" text-anchor="middle" fill="#ff5260" font-family="Arial,sans-serif" font-size="28" font-weight="800">RÉFLEXES IMMÉDIATS DE SÉCURITÉ</text>
<g font-family="Arial,sans-serif">
  <g transform="translate(90 230)">
    <rect width="330" height="470" rx="24" fill="#202936"/>
    <circle cx="70" cy="70" r="38" fill="#e63946"/><text x="70" y="82" text-anchor="middle" fill="white" font-size="36" font-weight="900">1</text>
    <path d="M95 255h145l-55-55m55 55-55 55" stroke="#f5f5f5" stroke-width="22" fill="none"/>
    <text x="165" y="365" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">ÉLOIGNE-TOI</text>
    <text x="165" y="410" text-anchor="middle" fill="#bfc9d6" font-size="22">Quitte la zone et</text><text x="165" y="440" text-anchor="middle" fill="#bfc9d6" font-size="22">cherche de l'air frais.</text>
  </g>
  <g transform="translate(455 230)">
    <rect width="330" height="470" rx="24" fill="#202936"/>
    <circle cx="70" cy="70" r="38" fill="#e63946"/><text x="70" y="82" text-anchor="middle" fill="white" font-size="36" font-weight="900">2</text>
    <path d="M110 185l55-40 55 40 45 95-52 22-18-55v105h-60V247l-18 55-52-22z" fill="#f5f5f5"/>
    <text x="165" y="365" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">RETIRE LES VÊTEMENTS</text>
    <text x="165" y="410" text-anchor="middle" fill="#bfc9d6" font-size="22">Évite de les passer</text><text x="165" y="440" text-anchor="middle" fill="#bfc9d6" font-size="22">sur le visage.</text>
  </g>
  <g transform="translate(820 230)">
    <rect width="330" height="470" rx="24" fill="#202936"/>
    <circle cx="70" cy="70" r="38" fill="#e63946"/><text x="70" y="82" text-anchor="middle" fill="white" font-size="36" font-weight="900">3</text>
    <path d="M75 245q90-75 180 0-90 75-180 0z" fill="none" stroke="#f5f5f5" stroke-width="18"/><circle cx="165" cy="245" r="32" fill="#80c9ff"/>
    <path d="M120 315q45 45 90 0" stroke="#80c9ff" stroke-width="14" fill="none"/>
    <text x="165" y="365" text-anchor="middle" fill="#fff" font-size="29" font-weight="900">RINCE LES YEUX</text>
    <text x="165" y="410" text-anchor="middle" fill="#bfc9d6" font-size="22">10 à 15 minutes.</text><text x="165" y="440" text-anchor="middle" fill="#ff5260" font-size="22" font-weight="800">NE FROTTE PAS.</text>
  </g>
  <g transform="translate(1185 230)">
    <rect width="330" height="470" rx="24" fill="#202936"/>
    <circle cx="70" cy="70" r="38" fill="#e63946"/><text x="70" y="82" text-anchor="middle" fill="white" font-size="36" font-weight="900">4</text>
    <path d="M80 190h170v135H80z" fill="#f5f5f5"/><path d="M95 260q70 60 140 0" stroke="#80c9ff" stroke-width="16" fill="none"/>
    <text x="165" y="365" text-anchor="middle" fill="#fff" font-size="29" font-weight="900">LAVE LA PEAU</text>
    <text x="165" y="410" text-anchor="middle" fill="#bfc9d6" font-size="22">Eau tiède + savon doux.</text><text x="165" y="440" text-anchor="middle" fill="#bfc9d6" font-size="22">Sans frotter agressivement.</text>
  </g>
</g>
<rect x="140" y="750" width="1320" height="70" rx="18" fill="#351c22" stroke="#e63946" stroke-width="2"/>
<text x="800" y="795" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Gêne respiratoire, brûlure, cloques ou troubles visuels : contacte immédiatement les secours.</text>
</svg>